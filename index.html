<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS 與雷達追蹤器 (平滑版)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-top: 0; font-size: 1.4rem; }
        
        .radar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
            position: relative;
        }
        canvas {
            background-color: #1a1a1a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5) inset, 0 4px 8px rgba(0,0,0,0.2);
            max-width: 100%;
        }
        .radar-label {
            position: absolute;
            top: -5px;
            font-size: 0.8rem;
            color: #d9534f;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 10;
        }

        .data-group {
            margin-bottom: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            display: flex;
            flex-direction: column;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .data-row:last-child { margin-bottom: 0; }
        .label { font-size: 0.85rem; color: #666; }
        .value { font-size: 1rem; font-weight: bold; }
        .coords { font-size: 0.8rem; color: #555; font-family: monospace; }
        .highlight { color: #28a745; font-size: 1.2rem !important; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background-color: #0056b3; }
        #enable-compass-btn { background-color: #28a745; margin-bottom: 10px; }
        #enable-compass-btn:active { background-color: #218838; }
        
        #status { text-align: center; font-size: 0.9rem; color: #d9534f; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>GPS 雷達追蹤器</h2>
    <div id="status">等待 GPS 訊號...</div>

    <div class="radar-container">
        <div class="radar-label">手機朝向 (前)</div>
        <canvas id="radar" width="280" height="280"></canvas>
    </div>

    <button id="enable-compass-btn">1. 授權並啟用指南針</button>
    <button id="set-origin-btn">2. 設當前位置為初始點</button>

    <div style="margin-top: 15px;"></div>

    <div class="data-group">
        <div class="data-row">
            <span class="label">初始點</span>
            <span class="value" id="initial-status">尚未設定</span>
        </div>
        <div class="data-row">
            <span class="coords" id="initial-coords">--</span>
        </div>
    </div>
    
    <div class="data-group">
        <div class="data-row">
            <span class="label"> </span>
            <span class="value" id="heading"> </span>
        </div>
        <div class="data-row">
            <span class="coords" id="current-coords">讀取中...</span>
        </div>
    </div>

    <div class="data-group">
        <div class="data-row">
            <span class="label">目標方位 (正北0°)</span>
            <span class="value" id="bearing">0°</span>
        </div>
        <div class="data-row">
            <span class="label">目標距離</span>
            <span class="value highlight" id="distance">0 m</span>
        </div>
    </div>
</div>

<script>
    // === 核心變數 ===
    let initialPos = null;
    let currentPos = null;
    let currentDistance = 0;
    let targetBearing = 0;

    // 指南針平滑化變數
    let targetHeading = 0;  // 感測器讀到的真實數值
    let currentHeading = 0; // UI 動畫平滑過渡的數值

    // DOM 元素
    const statusEl = document.getElementById('status');
    const distanceEl = document.getElementById('distance');
    const bearingEl = document.getElementById('bearing');
    const headingEl = document.getElementById('heading');
    const initialStatusEl = document.getElementById('initial-status');
    const initialCoordsEl = document.getElementById('initial-coords');
    const currentCoordsEl = document.getElementById('current-coords');
    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');

    // === 數學與公式 ===
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // Haversine 距離公式
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = toRadians(lat2 - lat1), dLon = toRadians(lon2 - lon1);
        const a = Math.sin(dLat/2) ** 2 + Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * Math.sin(dLon/2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 方位角公式
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const phi1 = toRadians(lat1), phi2 = toRadians(lat2), deltaLambda = toRadians(lon2 - lon1);
        const y = Math.sin(deltaLambda) * Math.cos(phi2);
        const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
        return (toDegrees(Math.atan2(y, x)) + 360) % 360;
    }

    function formatCoords(lat, lon) {
        return `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    }

    // === 感測器事件處理 ===
    function handleOrientation(event) {
        if (event.webkitCompassHeading !== undefined) {
            targetHeading = event.webkitCompassHeading;
        } else if (event.alpha !== null) {
            targetHeading = 360 - event.alpha;
        }
    }

    // === 動畫與雷達繪製迴圈 (60Hz) ===
    function renderLoop() {
        // 1. 指南針低通濾波 (平滑運算，解決 359跳0的翻轉問題)
        let diff = targetHeading - currentHeading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        
        currentHeading += diff * 0.1; // 0.1是平滑係數，確保指針不狂抖
        
        let displayHeading = (currentHeading % 360 + 360) % 360;
        headingEl.textContent = `朝向: ${displayHeading.toFixed(1)}°`;

        // 2. 繪製雷達圖
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const maxRadius = centerX - 20;

        ctx.clearRect(0, 0, width, height);

        // 雷達底圖
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, (maxRadius / 4) * i, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(centerX, 20); ctx.lineTo(centerX, height - 20);
        ctx.moveTo(20, centerY); ctx.lineTo(width - 20, centerY);
        ctx.stroke();

        // 標記正北方 (N)
        const northRelativeRad = (-currentHeading) * (Math.PI / 180);
        const northRadius = maxRadius + 12; 
        const northX = centerX + northRadius * Math.sin(northRelativeRad);
        const northY = centerY - northRadius * Math.cos(northRelativeRad);

        ctx.fillStyle = '#00ff00';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('N', northX, northY);

        // 中心點
        ctx.fillStyle = '#007bff';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
        ctx.fill();

        // 掃描特效
        const time = Date.now() / 1000;
        ctx.fillStyle = 'rgba(40, 167, 69, 0.15)';
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, maxRadius, time % (Math.PI*2), (time % (Math.PI*2)) + 0.5);
        ctx.fill();

        // 標記目標點
        if (initialPos && currentPos) {
            let relativeRad = (targetBearing - currentHeading) * (Math.PI / 180);

            // 動態縮放
            let scaleRange = Math.max(20, currentDistance * 1.2); 
            let drawRadius = (currentDistance / scaleRange) * maxRadius;
            if (drawRadius > maxRadius) drawRadius = maxRadius; 

            const targetX = centerX + drawRadius * Math.sin(relativeRad);
            const targetY = centerY - drawRadius * Math.cos(relativeRad);

            // 畫紅點
            ctx.fillStyle = '#d9534f';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 7, 0, Math.PI * 2);
            ctx.fill();

            // 畫連線
            ctx.strokeStyle = 'rgba(217, 83, 79, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(targetX, targetY);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 呼叫下一幀
        requestAnimationFrame(renderLoop);
    }
    
    // 啟動動畫引擎
    requestAnimationFrame(renderLoop);

    // === 按鈕事件：啟用指南針 ===
    document.getElementById('enable-compass-btn').addEventListener('click', () => {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    document.getElementById('enable-compass-btn').style.display = 'none';
                } else alert("指南針權限被拒絕。");
            }).catch(console.error);
        } else {
            // 防衝突綁定機制 (Android)
            window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
            window.removeEventListener('deviceorientation', handleOrientation, true);
            
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
            document.getElementById('enable-compass-btn').style.display = 'none';
        }
    });

    // === 按鈕事件：鎖定初始點 ===
    document.getElementById('set-origin-btn').addEventListener('click', () => {
        if (currentPos) {
            initialPos = { ...currentPos };
            initialStatusEl.textContent = "已鎖定";
            initialStatusEl.style.color = "#28a745";
            initialCoordsEl.textContent = formatCoords(initialPos.lat, initialPos.lon);
            statusEl.textContent = "已更新初始點";
            statusEl.style.color = "#28a745";
        } else {
            alert("尚未取得 GPS 座標。");
        }
    });

    // === 啟動 GPS 追蹤 ===
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (position) => {
                currentPos = { lat: position.coords.latitude, lon: position.coords.longitude };
                currentCoordsEl.textContent = formatCoords(currentPos.lat, currentPos.lon);
                statusEl.textContent = `GPS 更新中 (精度 ${position.coords.accuracy.toFixed(0)}m)`;
                statusEl.style.color = "#28a745";

                if (initialPos) {
                    currentDistance = calculateDistance(initialPos.lat, initialPos.lon, currentPos.lat, currentPos.lon);
                    targetBearing = calculateBearing(currentPos.lat, currentPos.lon, initialPos.lat, initialPos.lon);
                    
                    distanceEl.textContent = currentDistance > 1000 ? `${(currentDistance/1000).toFixed(2)} km` : `${currentDistance.toFixed(1)} m`;
                    bearingEl.textContent = `${targetBearing.toFixed(1)}°`;
                }
            },
            (error) => { statusEl.textContent = "GPS 錯誤或無訊號"; statusEl.style.color = "#d9534f"; },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
    }
</script>
</body>
</html>
